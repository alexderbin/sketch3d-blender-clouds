# Composition recipes (compose.py): camera, light and style, roles in fractions of the frame — the centre U,
# the width (a fraction of the frame), the top V, the distance (m). Layout rules: one main mass, a
# counterweight smaller and lower, overlap instead of touching, a calm strip, tops at different heights; the
# check is silhouettes (notan). The sun — from the view axis (° in azimuth, + — to the left) and the
# elevation.
spacious:       # spacious: one tower, a counterweight, a lot of sky
  camera: {z: 3000, tilt: 3, lens: 28}
  style: warm_painted
  haze: 2.0
  sun: [-62, 12]
  base: 1700
  scene: {floor: 0.95, humps: 1, wisps: 1, sink: 450}
  roles:
    - {name: main, type: congestus, U: 0.70, width: 0.36, top: 0.86, dist: 19000, seed: 21, kw: {tower: -12}}
    - {name: counterweight, type: mediocris, U: 0.13, width: 0.34, top: 0.62, dist: 12500, seed: 25, kw: {lean: -0.4}}
    - {name: third, type: mediocris, U: 0.47, width: 0.15, top: 0.53, dist: 24000, seed: 22}
    - {name: chain, type: bank_far, U: 0.5, width: 1.15, top: 0.47, dist: 38000, seed: 23}
rich:           # rich: large masses in layers across the whole frame — the sky4b layout, roles with a hierarchy
  camera: {z: 3000, tilt: 3, lens: 28}
  style: warm_painted
  haze: 2.0
  sun: [-62, 12]
  base: 1700
  scene: {floor: 0.95, humps: 1, wisps: 1, sink: 450}
  roles:                         # fractions of the frame — the sky4b layout by mass centres (the masses are partly beyond the frame edge)
    - {name: main, type: bank, U: 0.61, width: 0.71, top: 0.81, dist: 24000, seed: 12, peak: 0.35}
    - {name: second, type: bank, U: 0.93, width: 0.64, top: 0.72, dist: 15000, seed: 13, peak: 0.4}
    - {name: a wall on the left, type: bank, U: 0.03, width: 1.12, top: 1.05, dist: 9000, seed: 11, peak: 0.6}
    - {name: far, type: bank, U: 0.29, width: 0.30, top: 0.54, dist: 33000, seed: 14, peak: 0.5}
# a storm by the node's light and weather over the rich masses (stand: weather=storm lightning=N), not by an
# anvil: towers, anvils and lenses looked like "some buildings made of clouds"; the kinds congestus,
# cumulonimbus, lenticular are in types.yaml, not in the recipes kinds one at a time — the kinds sheet (one
# hero per frame)
type_mediocris:    {camera: {z: 3000, tilt: 3, lens: 28}, style: warm_painted, haze: 1.2, sun: [-62, 12], base: 1700, scene: {floor: 0.95, sink: 300},
                    roles: [{type: mediocris, U: 0.5, width: 0.45, top: 0.7, dist: 12000, seed: 52}]}

# above a castle in the mountains (bench/castle.py): the camera is the scene's far camera, the bases are above
# the scene's mountains (base: auto); light — the variant's light
castle_fair:       # a clear day: medium cumulus above the ridges, spacious
  camera: scene
  light: {time: day, weather: clear, sun_rel: -70}
  roles:
    - {name: main, type: mediocris, U: 0.70, width: 0.24, top: 0.93, dist: 9000, seed: 61}
    - {name: counterweight, type: mediocris, U: 0.24, width: 0.15, top: 0.84, dist: 13000, seed: 62}
    - {name: third, type: mediocris, U: 0.40, width: 0.07, top: 0.76, dist: 19000, seed: 63}
    - {name: chain, type: bank_far, U: 0.5, width: 1.1, top: 0.70, dist: 30000, seed: 64}
castle_rich:       # evening: rich masses behind the mountains (the sky4b layout)
  camera: scene
  light: {time: sunset, weather: clear, sun_rel: -35}
  roles:
    - {name: main, type: bank, U: 0.60, width: 0.70, top: 0.97, dist: 16000, seed: 12, peak: 0.35}
    - {name: second, type: bank, U: 0.95, width: 0.5, top: 0.86, dist: 11000, seed: 13, peak: 0.4}
    - {name: a wall on the left, type: bank, U: 0.05, width: 0.6, top: 1.02, dist: 9000, seed: 11, peak: 0.6}
    - {name: far, type: bank_far, U: 0.4, width: 1.1, top: 0.72, dist: 28000, seed: 14}
castle_storm:      # a storm: heavy dark masses low above the mountains, lightning inside
  camera: scene
  light: {time: day, weather: overcast, sun_rel: -80, sky_k: 0.3, ground_k: 0.2, haze_k: 0.6, dens: 0.7, ts_blur: 3, flashes: 2, flash: 3}
  roles:
    - {name: main, type: bank, U: 0.55, width: 0.95, top: 1.05, dist: 9000, seed: 71, peak: 0.45}
    - {name: second, type: bank, U: 0.12, width: 0.45, top: 0.95, dist: 7000, seed: 72, peak: 0.5}
    - {name: far, type: bank_far, U: 0.6, width: 1.1, top: 0.78, dist: 20000, seed: 73}
castle_afterglow:  # after sunset: one large mass glows pink above dark mountains
  camera: scene
  light: {time: afterglow, weather: clear, sun_rel: -25}
  roles:
    - {name: main, type: mediocris, U: 0.66, width: 0.36, top: 0.97, dist: 14000, seed: 81}
    - {name: counterweight, type: mediocris, U: 0.18, width: 0.18, top: 0.82, dist: 18000, seed: 82}
    - {name: chain, type: bank_far, U: 0.5, width: 1.1, top: 0.70, dist: 30000, seed: 83}
castle_night:      # night: clouds under the moon above the mountains
  camera: scene
  light: {time: night, weather: clear, sun_rel: 120}
  roles:
    - {name: main, type: bank, U: 0.62, width: 0.6, top: 0.95, dist: 15000, seed: 91, peak: 0.4}
    - {name: counterweight, type: mediocris, U: 0.15, width: 0.22, top: 0.84, dist: 12000, seed: 92}
    - {name: chain, type: bank_far, U: 0.5, width: 1.1, top: 0.70, dist: 30000, seed: 93}

# five cloud covers over one scene (the light is the same — afternoon, the sun to the side); layers — ext, alt
# | above_valley
castle_v1_field:   # a scatter: a field of medium and flat cumulus across the whole sky, the distant ones smaller and lower
  camera: scene
  light: {time: afternoon, weather: clear, sun_rel: -60}
  roles:
    - {name: near, type: mediocris, U: 0.78, width: 0.20, top: 0.86, dist: 8000, seed: 101}
    - {name: left, type: mediocris, U: 0.16, width: 0.15, top: 0.80, dist: 10000, seed: 102}
    - {name: average, type: mediocris, U: 0.46, width: 0.11, top: 0.74, dist: 13000, seed: 103}
    - {name: flat 1, type: humilis, U: 0.25, width: 0.09, top: 0.66, dist: 17000, seed: 104}
    - {name: flat 2, type: humilis, U: 0.72, width: 0.08, top: 0.64, dist: 20000, seed: 105}
    - {name: flat 3, type: humilis, U: 0.92, width: 0.07, top: 0.62, dist: 23000, seed: 106}
    - {name: far, type: humilis, U: 0.08, width: 0.06, top: 0.60, dist: 26000, seed: 107}
castle_v2_wall:    # a wall: rich masses rise behind the distant mountains across the full width of the frame
  camera: scene
  light: {time: afternoon, weather: clear, sun_rel: -60}
  roles:
    - {name: wall, type: bank, U: 0.55, width: 1.30, top: 0.98, dist: 26000, seed: 111, peak: 0.4}
    - {name: left, type: bank, U: 0.10, width: 0.45, top: 0.90, dist: 19000, seed: 112, peak: 0.5}
castle_v3_single:  # one large cloud above a lake, a lot of empty sky
  camera: scene
  light: {time: afternoon, weather: clear, sun_rel: -60}
  roles:
    - {name: main, type: mediocris, U: 0.60, width: 0.44, top: 0.97, dist: 12000, seed: 121}
    - {name: small, type: humilis, U: 0.14, width: 0.06, top: 0.62, dist: 24000, seed: 122}
castle_v4_sea:     # clouds wrap around the mountains: a layer at mid-height of the ridges, the peaks above it; a couple of cumulus higher up
  camera: scene
  light: {time: afternoon, weather: clear, sun_rel: -60}
  roles:
    - {name: belt, type: stratocumulus, dist: 14000, ext: 22000, mid_ridge: 0.45, thick: 260, cover: 0.82, cell: 1300, seed: 131}
    - {name: cumulus, type: mediocris, U: 0.74, width: 0.16, top: 0.84, dist: 14000, seed: 132}
    - {name: cumulus 2, type: humilis, U: 0.24, width: 0.10, top: 0.70, dist: 21000, seed: 133}
castle_v5_high:    # high sky: altocumulus "fleece" and cirrus, no cumulus
  camera: scene
  light: {time: afternoon, weather: clear, sun_rel: -60}
  roles:
    - {name: whitecaps, type: altocumulus, dist: 18000, ext: 36000, alt: 4200, seed: 141}
    - {name: cirrus, type: cirrus, dist: 24000, ext: 60000, alt: 8500, seed: 142, cover: 0.3}

